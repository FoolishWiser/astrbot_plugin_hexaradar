<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>六边形能力雷达</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo">⬡</span>
        <h1>六边形能力雷达</h1>
        <button id="btn-settings" class="gear-btn" title="设置">⚙</button>
      </div>
      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="搜索：姓名 / 拼音 / 同音，如 xm、晓铭" autocomplete="off" />
        <select id="sort-select" class="sort-select" title="排序方式">
          <option value="composite">按综合分</option>
          <option value="social_composite">按社会参考分</option>
          <option value="scarcity">按稀缺值</option>
          <option value="name">按名称（拼音）</option>
          <option value="learning">按学习能力</option>
          <option value="psychology">按心理承受力</option>
          <option value="social">按社交能力</option>
          <option value="judgment">按判断决策</option>
          <option value="self_awareness">按自我认知</option>
          <option value="direction">按长期方向感</option>
        </select>
        <button id="sort-dir" class="btn ghost" title="切换升降序">↓</button>
        <div class="seg" role="tablist">
          <button id="view-cards" class="seg-btn active" title="卡片视图">▦</button>
          <button id="view-radars" class="seg-btn" title="雷达图视图">⬡</button>
          <button id="view-table" class="seg-btn" title="列表视图">☰</button>
        </div>
        <button id="btn-add" class="btn primary">+ 新建人员</button>
        <button id="btn-lock" class="btn ghost" title="清除密码并锁定页面" hidden>🔒</button>
      </div>
    </header>

    <main id="content" class="content">
      <div id="err-banner" class="err-banner" hidden></div>
      <div id="empty" class="empty" hidden>
        <div class="empty-icon">⬡</div>
        <p id="empty-text">暂无人员数据，点击「+ 新建人员」开始</p>
      </div>
      <div id="cards" class="cards" hidden></div>
      <div id="radars" class="radars" hidden></div>
      <div id="table-wrap" class="table-wrap" hidden>
        <table class="table">
          <thead>
            <tr>
              <th data-sort="name">姓名</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div id="py-stack" class="py-stack" hidden>
        <nav id="py-index" class="py-index">
          <div id="py-letters" class="py-letters"></div>
        </nav>
        <button id="py-reset" class="py-reset" title="清除筛选" hidden>✕</button>
      </div>
      <div id="detail" class="detail" hidden>
        <div class="detail-head">
          <button id="detail-back" class="btn ghost">← 返回</button>
          <div id="detail-mode" class="seg detail-mode" hidden>
            <button id="mode-base" class="seg-btn active">个人基准分</button>
            <button id="mode-social" class="seg-btn">社会参考分</button>
            <button id="mode-scar" class="seg-btn">稀缺值</button>
          </div>
        </div>
        <div class="detail-layout">
          <div class="detail-left">
            <div id="detail-avatar" class="avatar large"></div>
            <h2 id="detail-name" class="detail-name"></h2>
            <p id="detail-age" class="detail-age"></p>
            <div id="detail-radar" class="detail-radar"></div>
            <div id="detail-social-note" class="social-note" hidden></div>
            <div class="composite-box">综合 <span id="detail-composite" class="composite-value">0</span> 分</div>
          </div>
          <div class="detail-right">
            <div id="detail-scores" class="detail-scores"></div>
            <div class="detail-desc">
              <h3>备注</h3>
              <p id="detail-desc-text">—</p>
            </div>
            <div class="detail-actions">
              <button id="detail-edit" class="btn">编辑</button>
              <button id="detail-delete" class="btn danger">删除</button>
              <button id="detail-history" class="icon-btn" title="更新记录">🕘</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="password-modal" class="modal-mask" hidden>
      <div class="modal">
        <h2>🔒 需要访问密码</h2>
        <p class="hint">此页面受密码保护，请输入管理员配置的访问密码。</p>
        <input id="password-input" type="password" placeholder="访问密码" autocomplete="current-password" />
        <p id="password-error" class="error" hidden>密码错误，请重试</p>
        <div class="modal-actions">
          <button id="password-cancel" class="btn ghost">取消</button>
          <button id="password-ok" class="btn primary">解锁</button>
        </div>
      </div>
    </div>

    <div id="edit-modal" class="modal-mask" hidden>
      <div class="modal wide">
        <h2 id="edit-title">人员详情</h2>
        <div id="view-body" class="edit-layout" hidden>
          <div class="edit-left">
            <div id="view-radar" class="edit-radar"></div>
            <div class="composite-box">综合 <span id="view-composite" class="composite-value">0</span> 分</div>
          </div>
          <div class="edit-right">
            <div id="view-mode" class="seg detail-mode" hidden>
              <button id="v-mode-base" class="seg-btn active">个人基准分</button>
              <button id="v-mode-social" class="seg-btn">社会参考分</button>
              <button id="v-mode-scar" class="seg-btn">稀缺值</button>
            </div>
            <div id="view-name" class="view-name"></div>
            <div id="view-age" class="detail-age"></div>
            <div id="view-scores" class="detail-scores"></div>
            <div id="view-social-note" class="social-note" hidden></div>
            <div class="detail-desc">
              <h3>备注</h3>
              <p id="view-desc-text">—</p>
            </div>
            <div class="modal-actions">
              <div class="spacer"></div>
              <button id="view-close" class="btn ghost">关闭</button>
              <button id="view-edit" class="btn primary">编辑</button>
            </div>
          </div>
        </div>
        <div id="edit-body" class="edit-layout" hidden>
          <div class="edit-left">
            <div id="edit-radar" class="edit-radar"></div>
            <div class="composite-box">综合 <span id="edit-composite" class="composite-value">0</span> 分</div>
          </div>
          <div class="edit-right">
            <label class="field">
              <span>姓名</span>
              <input id="edit-name" type="text" placeholder="人员姓名" />
            </label>
            <label class="field">
              <span>年龄</span>
              <input id="edit-age" type="number" min="0" max="120" step="1" placeholder="可填，用于社会参考分" />
            </label>
            <div id="edit-sliders" class="sliders"></div>
            <label class="field">
              <span>备注</span>
              <input id="edit-desc" type="text" placeholder="备注 / 评价说明（可选）" />
            </label>
            <div class="modal-actions">
              <button id="edit-delete" class="btn danger">删除</button>
              <div class="spacer"></div>
              <button id="edit-cancel" class="btn ghost">取消</button>
              <button id="edit-save" class="btn primary">保存</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="history-modal" class="modal-mask" hidden>
      <div class="modal wide">
        <h2 id="history-title">更新记录</h2>
        <div id="history-list" class="history-list"></div>
        <div class="modal-actions">
          <div class="spacer"></div>
          <button id="history-close" class="btn ghost">关闭</button>
        </div>
      </div>
    </div>

    <div id="settings-modal" class="modal-mask" hidden>
      <div class="modal wide">
        <h2>⚙ 设置</h2>
        <div class="settings-body">
          <h3>显示与行为</h3>
          <label class="settings-row">
            <span>显示社会参考分<small>25 岁成熟基准 · 未填年龄不显示</small></span>
            <input id="set-social" type="checkbox" />
          </label>
          <label class="settings-row">
            <span>显示稀缺值<small>独特性算法 · 未填年龄不显示</small></span>
            <input id="set-scar" type="checkbox" />
          </label>
          <label class="settings-row">
            <span>AI 回答后自动评审改分<small>对话命中库内姓名（含别名）时触发，改分静默允许并提示</small></span>
            <input id="set-auto" type="checkbox" />
          </label>
          <label class="settings-row">
            <span>评审触发范围<small>both=用户消息或回复提及；user=仅用户提及；reply=仅回复提及</small></span>
            <select id="set-auto-trigger">
              <option value="both">both（推荐）</option>
              <option value="user">user</option>
              <option value="reply">reply</option>
            </select>
          </label>
          <label class="settings-row">
            <span>评审必须引用证据<small>无对话原文证据的改分提案将被拒绝</small></span>
            <input id="set-auto-evidence" type="checkbox" />
          </label>
          <label class="settings-row">
            <span>单次调整上限<small>0=不限制；&gt;0 时每维度每次调整不超过 ±N</small></span>
            <input id="set-auto-delta" type="number" min="0" max="100" step="1" />
          </label>
          <label class="settings-row">
            <span>评审冷却时间（秒）<small>0=关闭；同一人短时间重复提及不重复评审</small></span>
            <input id="set-auto-cooldown" type="number" min="0" step="1" />
          </label>
          <label class="settings-row">
            <span>评审提供商<small>从 AstrBot 已有配置中选择；留空跟随当前会话</small></span>
            <select id="set-auto-provider"></select>
          </label>
          <h3>访问密码（仅保护 WebUI）</h3>
          <label class="settings-row">
            <span>启用密码保护</span>
            <input id="set-pwd-on" type="checkbox" />
          </label>
          <label class="settings-row">
            <span>密码</span>
            <input id="set-pwd" type="password" placeholder="访问密码" autocomplete="new-password" />
          </label>
          <h3>匹配别名（对话匹配自定义）</h3>
          <p class="hint">库内姓名为 A 时可自定义为 B，自动评审匹配对话时匹配 B 而非 A。人物展示仍用库内真名。</p>
          <div id="set-alias-list" class="settings-alias-list"></div>
          <div class="settings-alias-add">
            <input id="set-alias-name" type="text" placeholder="库内姓名（必须存在）" />
            <input id="set-alias-alias" type="text" placeholder="自定义别名（留空删除）" />
            <button id="set-alias-save" class="btn ghost">保存别名</button>
          </div>
        </div>
        <div class="modal-actions">
          <span id="settings-hint" class="hint" hidden></span>
          <div class="spacer"></div>
          <button id="settings-close" class="btn ghost">关闭</button>
          <button id="settings-save" class="btn primary">保存全部设置</button>
        </div>
      </div>
    </div>

    <div id="confirm-modal" class="modal-mask" hidden>
      <div class="modal">
        <h2 id="confirm-title">确认操作</h2>
        <p id="confirm-message" class="hint"></p>
        <div class="modal-actions">
          <button id="confirm-cancel" class="btn ghost">取消</button>
          <div class="spacer"></div>
          <button id="confirm-ok" class="btn danger">确认删除</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
